<!doctype html>
<html lang="pt-BR" data-theme="youtube">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>{{titulo}}</title>
<link rel="stylesheet" href="{{ds}}/tokens.css">
<link rel="stylesheet" href="{{ds}}/assets/fontes/fontes.css">
<link rel="stylesheet" href="{{ds}}/components/base.css">
</head>
<body>
<!-- Layout comparativo: dois ícones e VS na fileira de baixo. -->
<main class="canvas thumb thumb--comparativo">
  <img class="thumb__lockup" src="{{ds}}/assets/Marca/logo-po-fundo-escuro.png" alt="Pesquisa Operacional para todos.">
  <h1 class="thumb__titulo">
    <span class="thumb__headline thumb-headline">{{headline}}</span>
    <span class="thumb__subhead thumb-subhead">{{subhead}}</span>
  </h1>
  <div class="thumb__duelo">
    <div class="thumb__icone"><img src="{{ds}}/miniaturas/icones/{{icone}}.svg" alt=""></div>
    <span class="thumb__vs">VS</span>
    <div class="thumb__icone"><img src="{{ds}}/miniaturas/icones/{{icone2}}.svg" alt=""></div>
  </div>
  <p class="thumb__faixa thumb-banner">{{faixa}}</p>
</main>
</body>
</html>
