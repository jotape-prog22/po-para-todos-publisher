  <g fill="#A7C973"><circle cx="40" cy="60" r="9"/><circle cx="160" cy="45" r="9"/><circle cx="60" cy="150" r="9"/><circle cx="150" cy="160" r="9"/></g>
  <circle cx="100" cy="100" r="12" fill="#51AA04"/>
