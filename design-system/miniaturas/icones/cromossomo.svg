  <g fill="none" stroke="#A7C973" stroke-width="4"><circle cx="40" cy="100" r="6"/><circle cx="70" cy="100" r="6"/><circle cx="100" cy="100" r="6"/><circle cx="130" cy="100" r="6"/><circle cx="160" cy="100" r="6"/></g>
  <g fill="#A7C973"><circle cx="40" cy="150" r="8"/><circle cx="70" cy="150" r="8"/></g>
  <g fill="#51AA04"><circle cx="100" cy="150" r="8"/><circle cx="130" cy="150" r="8"/><circle cx="160" cy="150" r="8"/></g>
