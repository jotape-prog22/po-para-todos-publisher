<!doctype html>
<html lang="pt-BR" data-theme="slides">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Slide-Capa — PO para Todos</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../assets/fontes/fontes.css">
<link rel="stylesheet" href="base.css">
</head>
<body>
<!-- Capa: título da aula (até 3 linhas), apresentador e projeto em slide-caption.
     Bloco centrado na vertical, ≤ 60% da largura; lado direito reservado ao motivo. -->
<main class="canvas slide slide--capa">
  <img class="slide__logo-unirio" src="../assets/Marca/logo-unirio.png" alt="UNIRIO — Universidade Federal do Estado do Rio de Janeiro">

  <div class="slide__bloco-capa">
    <h1 class="slide__title slide-title">Teorema das Folgas Complementares</h1>
    <p class="slide__caption slide-caption">Nome do Apresentador<br>Projeto PO para Todos – UNIRIO</p>
  </div>

  <img class="slide__motivo motivo" src="../assets/Marca/motivo-nos.svg" alt="">
</main>
</body>
</html>
