<!doctype html>
<html lang="pt-BR" data-theme="youtube">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Thumbnail-Conceito — PO para Todos</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../assets/fontes/fontes.css">
<link rel="stylesheet" href="base.css">
</head>
<body>
<!-- Conceito / teoria: mesma grade do Tutorial, sem ícone de ferramenta — o slot
     recebe o motivo de nós em brand-green-soft; faixa "TEORIA EXPLICADA".
     Palavra longa vai para o subhead (thumb-headline ≤ ~11 caracteres). -->
<main class="canvas thumb thumb--conceito">
  <img class="thumb__lockup" src="../assets/Marca/logo-po-fundo-escuro.png" alt="Pesquisa Operacional para todos.">

  <h1 class="thumb__titulo">
    <span class="thumb__headline thumb-headline">Folgas</span>
    <span class="thumb__subhead thumb-subhead">Complementares</span>
  </h1>

  <img class="thumb__icone motivo" src="../assets/Marca/motivo-nos.svg" alt="">

  <p class="thumb__faixa thumb-banner">Teoria explicada</p>
</main>
</body>
</html>
