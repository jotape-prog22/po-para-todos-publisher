<!doctype html>
<html lang="pt-BR" data-theme="slides">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Slide-Encerramento — PO para Todos</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../assets/fontes/fontes.css">
<link rel="stylesheet" href="base.css">
</head>
<body>
<!-- Encerramento: "Obrigado!" em slide-title, autoria em slide-caption com o link
     do projeto na última linha. Um único logo UNIRIO, maior, centrado à direita. -->
<main class="canvas slide slide--capa slide--encerramento">
  <img class="slide__logo-unirio" src="../assets/Marca/logo-unirio.png" alt="UNIRIO — Universidade Federal do Estado do Rio de Janeiro">

  <div class="slide__bloco-capa">
    <h1 class="slide__title slide-title">Obrigado!</h1>
    <p class="slide__caption slide-caption">Nome do Apresentador<br>Projeto PO para Todos – UNIRIO<br><a href="https://poparatodos.github.io/">poparatodos.github.io</a></p>
  </div>
</main>
</body>
