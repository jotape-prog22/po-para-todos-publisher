name: Publicar agenda do Instagram

# Roda a cada 30 min e publica o que venceu em instagram/agenda.json.
# O cron do GitHub não é garantido: em repositório com pouco movimento ele atrasa horas ou pula rodadas (em 29/09/2026
# rodou 3 vezes em 16 h). Por isso há dois gatilhos: este cron (nos minutos 7 e 37, fora da hora cheia, que é a mais
# congestionada) e um despertador externo que chama o workflow_dispatch com simular=false (docs/despertador-agenda.md).
# Manualmente (aba Actions → Run workflow) começa em modo simulação: mostra o que seria publicado, sem publicar.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      simular:
        description: "Só mostrar o que seria publicado (desmarque para publicar de verdade)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publicar-agenda
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A master tem a regra "Proteger master" (só admin empurra sem PR) e o GITHUB_TOKEN não contorna regras em
      # repositório pessoal: o estado da agenda sobe com o SEGREDOS_PAT (token do dono). Sem ele, o GITHUB_TOKEN
      # serve para ler e simular, mas o push do estado seria recusado.
      # ref: master — sem ele o checkout pega o commit do momento do disparo; uma rodada que esperou a anterior
      # terminar leria a agenda de antes e publicaria de novo o que a anterior acabou de publicar.
      - uses: actions/checkout@v4
        with:
          ref: master
          token: ${{ secrets.SEGREDOS_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Baixar a mídia aprovada (branch fila)
        run: |
          git fetch origin fila || { echo "branch fila ainda não existe — nada aprovado na fila"; exit 0; }
          git archive origin/fila instagram | tar -x || echo "fila vazia"

      - name: Publicar o que venceu
        timeout-minutes: 22
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ID: ${{ vars.IG_ID }}
          IG_USUARIO: ${{ vars.IG_USUARIO }}
          IG_EXPIRA_EM: ${{ vars.IG_EXPIRA_EM }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publicar-agenda.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.simular) && '--simular' || '' }}

      - name: Guardar o estado da agenda
        if: always()
        run: |
          git config user.name "publicador-po-para-todos"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/agenda.json
          git add 'instagram/*/publicacao*.json' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "sem mudanças de estado"
          else
            git commit -m "agenda: estado das publicações [skip ci]"
            # Até 5 tentativas: uma falha passageira (alguém enviou a agenda no mesmo segundo, erro 5xx do
            # GitHub) não pode perder o estado — sem ele a próxima rodada publicaria em dobro.
            # Dentro do "if", um comando que falha não derruba o passo: a falha final é explícita, depois do laço.
            gravado=0
            for tentativa in $(seq 1 5); do
              # -X theirs: numa rebase, "theirs" é o commit de estado do robô. Se a pessoa mexeu na agenda ao mesmo
              # tempo, o robô vence o trecho em conflito: publicar em dobro não tem volta; já perder uma edição
              # simultânea da pessoa aparece no --status e dá para refazer.
              if git pull --rebase --autostash -X theirs origin master \
                && node -e 'const a=JSON.parse(require("fs").readFileSync("instagram/agenda.json","utf8")); if(!Array.isArray(a.itens)) process.exit(1)' \
                && git push; then
                gravado=1
                break
              fi
              echo "tentativa $tentativa de 5 falhou — tentando de novo em 10 s"
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
            if [ "$gravado" != 1 ]; then
              echo "não consegui gravar o estado da agenda depois de 5 tentativas — risco de publicar em dobro: confira o --status"
              exit 1
            fi
          fi
